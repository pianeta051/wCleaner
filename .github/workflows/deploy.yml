name: Deploy infra

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    # Two runs deploying the same stack at once would fight over it.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/functions/yarn.lock

      - name: Check params files
        run: infra/scripts/check-params.sh

      - name: Typecheck functions
        run: |
          yarn --cwd backend/functions install --frozen-lockfile
          yarn --cwd backend/functions typecheck

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: infra/scripts/deploy.sh dev
