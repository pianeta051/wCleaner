version: 1
backend:
  phases:
    build:
      commands:
        - yarn install --cache
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - yarn install --pure-lockfile
    build:
      commands:
        - nvm use 24
        - yarn build:cd
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
