AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner environment stack (wcleaner-<env>). Only wires the nested stacks
  together and re-exports the outputs the front-end needs. Deployed with
  infra/scripts/deploy.sh, with the values from infra/params/<env>.json.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Label used in resource names, tags and outputs. Nothing branches on it.
  AllowedRedirectOrigins:
    Type: String
    Description: Comma-separated extra origins the auth emails may link to. Can be empty.

Resources:
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/data.yaml
      Parameters:
        Environment: !Ref Environment
  HostingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/hosting.yaml
      Parameters:
        Environment: !Ref Environment
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/auth.yaml
      Parameters:
        Environment: !Ref Environment
        # The auth emails link to the front-end hosted by this same stack.
        AppUrl: !GetAtt HostingStack.Outputs.AppUrl
        AllowedRedirectOrigins: !Ref AllowedRedirectOrigins
        FilesBucketArn: !GetAtt DataStack.Outputs.FilesBucketArn

Outputs:
  TableName:
    Value: !GetAtt DataStack.Outputs.TableName
  FilesBucketName:
    Value: !GetAtt DataStack.Outputs.FilesBucketName
  CustomMessageFunctionArn:
    Value: !GetAtt AuthStack.Outputs.CustomMessageFunctionArn
  UserPoolId:
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  UserPoolArn:
    Value: !GetAtt AuthStack.Outputs.UserPoolArn
  UserPoolClientId:
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId
  IdentityPoolId:
    Value: !GetAtt AuthStack.Outputs.IdentityPoolId
  AuthRoleArn:
    Value: !GetAtt AuthStack.Outputs.AuthRoleArn
  AdminGroupRoleArn:
    Value: !GetAtt AuthStack.Outputs.AdminGroupRoleArn
  WebBucketName:
    Value: !GetAtt HostingStack.Outputs.WebBucketName
  DistributionId:
    Value: !GetAtt HostingStack.Outputs.DistributionId
  AppUrl:
    Value: !GetAtt HostingStack.Outputs.AppUrl
