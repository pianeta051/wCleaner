AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner environment stack (wcleaner-<env>). Only wires the nested stacks
  together and re-exports the outputs the front-end needs. Deployed with
  infra/scripts/deploy.sh, with the values from infra/params/<env>.json.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Label used in resource names, tags and outputs. Nothing branches on it.
  AppUrl:
    Type: String
    Description: Base URL of the front-end, used for the links in the auth emails.
  AllowedRedirectOrigins:
    Type: String
    Description: Comma-separated extra origins the auth emails may link to. Can be empty.

Resources:
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/data.yaml
      Parameters:
        Environment: !Ref Environment
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/auth.yaml
      Parameters:
        Environment: !Ref Environment
        AppUrl: !Ref AppUrl
        AllowedRedirectOrigins: !Ref AllowedRedirectOrigins

Outputs:
  TableName:
    Value: !GetAtt DataStack.Outputs.TableName
  FilesBucketName:
    Value: !GetAtt DataStack.Outputs.FilesBucketName
  CustomMessageFunctionArn:
    Value: !GetAtt AuthStack.Outputs.CustomMessageFunctionArn
