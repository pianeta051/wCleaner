AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner environment stack (wcleaner-<env>). Only wires the nested stacks
  together and re-exports the outputs the front-end needs. Deployed with
  infra/scripts/deploy.sh, with the values from infra/params/<env>.json.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: Label used in resource names, tags and outputs. Nothing branches on it.

Resources:
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: stacks/data.yaml
      Parameters:
        Environment: !Ref Environment

Outputs:
  # Not needed by the front-end, but handy in the deploy output.
  TableName:
    Value: !GetAtt DataStack.Outputs.TableName
