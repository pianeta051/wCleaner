AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner placeholder nested stack. Only proves the nested stack flow
  (package, upload, deploy with the execution role). Deleted when data.yaml lands.

Parameters:
  Environment:
    Type: String

Resources:
  # Free and needs no permissions; a stack needs at least one resource.
  Placeholder:
    Type: AWS::CloudFormation::WaitConditionHandle

Outputs:
  Message:
    Value: !Sub wcleaner-${Environment} placeholder is deployed
