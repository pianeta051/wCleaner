AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner front-end hosting nested stack: a private S3 bucket served through
  CloudFront (origin access control), with the SPA fallback to index.html. Uses
  the default *.cloudfront.net domain; a custom domain comes later.

Parameters:
  Environment:
    Type: String

Resources:
  # Unlike the data resources, no Retain: the content is rebuilt on every deploy
  # (infra/scripts/deploy-frontend.sh). A stack delete fails while the bucket has
  # objects in it; empty it first.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wcleaner-${Environment}-web-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: wcleaner:environment
          Value: !Ref Environment

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub ${WebBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Only our distribution can read the site.
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub wcleaner-${Environment}-web
        Description: !Sub wcleaner-${Environment} front-end bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub wcleaner-${Environment} front-end
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web-bucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            # Required, and empty, when the origin uses an origin access control.
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingOptimized and SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # SPA routes (/log-in, /reset-password, deep links) aren't objects. S3
        # answers 403 for a missing key (no s3:ListBucket for CloudFront), 404 if
        # it were allowed to list: both serve the app.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: wcleaner:environment
          Value: !Ref Environment

Outputs:
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  AppUrl:
    Value: !Sub https://${Distribution.DomainName}
