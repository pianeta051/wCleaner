AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner data nested stack: the single DynamoDB table. Same keys and indexes
  as Amplify's (amplify/backend/storage/wcleaner), so the Lambda code and the
  data copy work unchanged.

Parameters:
  Environment:
    Type: String

Resources:
  # Named wcleaner-<env>-table, not wcleaner-<env>: Amplify's tables already use
  # that name in the old account, and the execution role is scoped to
  # table/wcleaner-*-table so it can't reach them.
  # CloudFormation can only add or remove one GSI per update: a change that
  # touches several has to be split into several deploys.
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub wcleaner-${Environment}-table
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
        - { AttributeName: slug, AttributeType: S }
        - { AttributeName: job_start_time_pk, AttributeType: N }
        - { AttributeName: start, AttributeType: N }
        - { AttributeName: name_lowercase, AttributeType: S }
        - { AttributeName: color, AttributeType: S }
        - { AttributeName: job_type_id, AttributeType: S }
        - { AttributeName: job_invoice_pk, AttributeType: N }
        - { AttributeName: invoice_date, AttributeType: N }
        - { AttributeName: invoice_number, AttributeType: N }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: customer_email
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: customer_slug
          KeySchema:
            - { AttributeName: slug, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: job_start_time
          KeySchema:
            - { AttributeName: job_start_time_pk, KeyType: HASH }
            - { AttributeName: start, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: job_type_name
          KeySchema:
            - { AttributeName: name_lowercase, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: job_type_color
          KeySchema:
            - { AttributeName: color, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: job_type_id
          KeySchema:
            - { AttributeName: job_type_id, KeyType: HASH }
          Projection: { ProjectionType: ALL }
        - IndexName: invoice_date
          KeySchema:
            - { AttributeName: job_invoice_pk, KeyType: HASH }
            - { AttributeName: invoice_date, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: invoice_number
          KeySchema:
            - { AttributeName: job_invoice_pk, KeyType: HASH }
            - { AttributeName: invoice_number, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - Key: wcleaner:environment
          Value: !Ref Environment

Outputs:
  TableName:
    Value: !Ref Table
  TableArn:
    Value: !GetAtt Table.Arn
