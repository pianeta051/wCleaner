AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  wCleaner per-account bootstrap: artifacts bucket, GitHub OIDC provider,
  deployer role (assumed by GitHub Actions) and CloudFormation execution role.
  Deployed once per account, by hand, by an admin. CI can't update it.

Parameters:
  GitHubSubjects:
    Type: CommaDelimitedList
    Description: >-
      OIDC "sub" patterns the deployer role accepts
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      ARN of an existing token.actions.githubusercontent.com OIDC provider in this
      account. Leave empty to create one (only one can exist per account).

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub wcleaner-artifacts-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM no longer checks these for GitHub (it trusts the root CA), but older
      # tooling expects them to be set.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Assumed by GitHub Actions. Can only drive CloudFormation on wcleaner-* stacks
  # and hand over the execution role; it can't create resources itself.
  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wcleaner-github-deployer
      Description: Assumed by GitHub Actions (OIDC) to deploy wcleaner-* stacks
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DriveWcleanerStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/wcleaner-*/*
              - Sid: DenyChangingBootstrapStack
                Effect: Deny
                NotAction:
                  - cloudformation:Describe*
                  - cloudformation:Get*
                  - cloudformation:List*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/wcleaner-bootstrap/*
              - Sid: ValidateTemplates
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: UploadArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Sid: ListArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wcleaner-cfn-execution
      Description: Used by CloudFormation to create the resources of wcleaner-* stacks
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scaffolding
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: NestedStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/wcleaner-*/*
              - Sid: ReadArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*

Outputs:
  ArtifactsBucketName:
    Description: Bucket for packaged templates and Lambda code
    Value: !Ref ArtifactsBucket
  DeployerRoleArn:
    Description: Set as the AWS_ROLE_ARN repository variable in each repo that deploys here
    Value: !GetAtt DeployerRole.Arn
  ExecutionRoleArn:
    Description: Passed to CloudFormation with --role-arn by deploy.sh
    Value: !GetAtt ExecutionRole.Arn
